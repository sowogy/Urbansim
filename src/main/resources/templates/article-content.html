<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{default-board::layout(~{::section})}">
<body>
<section class="max-w-4xl mx-auto px-4 py-8">
    <!-- 메인 게시글 카드 -->
    <article class="bg-white rounded-2xl shadow-lg overflow-hidden mb-6">
        <!-- 헤더: 제목과 메타 정보 -->
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 px-8 py-6">
            <h1 class="text-white text-3xl mb-4" th:text="${article.title}">title</h1>
            <div class="flex flex-wrap items-center gap-4 text-white/90 text-sm">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span th:text="${article.name}">김동률</span>
                </div>
                <div class="flex items-center gap-2 text-white/70">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                    <span th:text="${#calendars.format(article.created, 'yyyy-MM-dd HH:mm')}">2025-08-13 22:38</span>
                </div>
            </div>
        </div>

        <!-- 본문 내용 -->
        <div class="px-8 py-8">
            <div class="prose max-w-none">
                <p class="text-gray-800 leading-relaxed whitespace-pre-wrap text-base" th:text="${article.description}">description</p>
            </div>
        </div>

        <!-- 첨부파일 섹션 -->
        <div th:if="${article.fileUrl}" class="px-8 pb-8">
            <div class="border-t border-gray-200 pt-6">
                <h3 class="text-gray-900 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                    </svg>
                    <span>첨부파일</span>
                </h3>
                <div class="bg-gray-50 rounded-xl p-5 border border-gray-200">
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex items-center gap-4 flex-1">
                            <div class="flex-shrink-0 w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                </svg>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-gray-900 truncate mb-1" th:text="${article.fileTitle}">첨부파일</div>
                                <div class="text-sm text-gray-500">
                                    <span th:text="${#numbers.formatDecimal(article.fileSize/1024.0/1024.0,1,2)}">0.00</span> MB
                                </div>
                            </div>
                        </div>
                        <button
                                id="downloadBtn"
                                th:data-articleNum="${article.getId()}"
                                class="flex-shrink-0 inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-lg hover:from-blue-600 hover:to-indigo-700 transition-all shadow-sm hover:shadow-md">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                            <span>다운로드</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 게시글 번호 (하단에 작게) -->
        <div class="px-8 pb-6">
            <div class="text-xs text-gray-400">
                게시글 번호: <span th:text="${article.id}">id</span>
            </div>
        </div>
    </article>

    <!-- 액션 버튼 영역 -->
    <div class="flex items-center justify-between gap-4">
        <!-- 목록으로 돌아가기 -->
        <button id="move-previous"
           class="inline-flex items-center gap-2 px-5 py-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-all border border-gray-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            <span>이전으로</span>
        </button>

        <!-- 수정/삭제 버튼 (작성자만) -->
        <div sec:authorize="isAuthenticated()"
             th:if="${#authentication.principal.memberId == article.getMember_id()}"
             class="flex gap-3">
            <a th:href="@{/article/edit(id=${article.id})}"
               class="inline-flex items-center gap-2 px-5 py-3 bg-amber-500 text-white rounded-xl hover:bg-amber-600 transition-all shadow-sm hover:shadow-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                <span>수정</span>
            </a>

            <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
            <button type="button"
                    th:attr="data-href=@{/article/delete(id=${article.id})}"
                    onclick="confirmDelete(this)"
                    class="inline-flex items-center gap-2 px-5 py-3 bg-red-500 text-white rounded-xl hover:bg-red-600 transition-all shadow-sm hover:shadow-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                <span>삭제</span>
            </button>

            <script>
                function confirmDelete(el) {
                    const url = el.getAttribute("data-href");
                    Swal.fire({
                        title: "삭제하시겠습니까?",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonColor: "#d33",
                        cancelButtonColor: "#3085d6",
                        confirmButtonText: "삭제",
                        cancelButtonText: "취소"
                    }).then((result) => {
                        if (result.isConfirmed) {
                            const form = document.createElement('form');
                            form.setAttribute('method', 'post');
                            form.setAttribute('action', url);

                            //csrf 토큰 삽입
                            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                            if(csrfToken) {
                               const hiddenField = document.createElement('input');
                               hiddenField.setAttribute('type', 'hidden');
                               hiddenField.setAttribute('name', '_csrf');
                               hiddenField.setAttribute('value', csrfToken);
                               form.appendChild(hiddenField);
                            }
                            document.body.appendChild(form);
                            form.submit();
                        }
                    });
                }
            </script>
        </div>
    </div>

    <script>
        document.getElementById('move-previous').addEventListener('click', function(e){
           history.back();
        });

        // 'downloadButton' id를 가진 버튼 요소를 찾습니다.
        const downloadBtn = document.getElementById('downloadBtn');

        // 버튼에 클릭 이벤트 리스너를 추가합니다.
        if (downloadBtn) {
            downloadBtn.addEventListener('click', async () => {
                // 버튼의 data-download-url 속성에서 다운로드 URL을 가져옵니다.
                const articleNum = downloadBtn.getAttribute('data-articleNum');

                try {
                    // fetch API를 사용해 서버에 파일을 요청합니다.
                    const response = await fetch('/article/download?id=' + articleNum);

                    // --- 에러 처리 부분 ---
                    // 응답 상태가 'ok'(200-299)가 아닐 경우 (예: 400 Bad Request)
                    if (!response.ok) {
                        // 서버가 보낸 에러 메시지(JSON 본문)를 읽어옵니다.
                        const errorResponse = await response.json();
                        // 팝업(alert)으로 에러 메시지를 띄웁니다.
                        alert('다운로드 실패!\n' + (errorResponse.message || '알 수 없는 오류가 발생했습니다.'));
                        return; // 함수 실행을 중단합니다.
                    }

                    // --- 성공 처리 부분 ---
                    const cd = response.headers.get('Content-Disposition');
                    let filename = 'download';
                    if (cd) {
                        // filename* 우선, 없으면 filename
                        const star = cd.match(/filename\*=(?:UTF-8''|)([^;]+)/i);
                        const plain = cd.match(/filename="?([^;"\r\n]+)"?/i);
                        const picked = (star && star[1]) || (plain && plain[1]);
                        if (picked) filename = decodeURIComponent(picked.trim());
                    }

                    // 응답 본문을 Blob(파일 데이터) 객체로 변환합니다.
                    const blob = await response.blob();
                    // Blob 데이터를 가리키는 임시 URL을 생성합니다.
                    const url = window.URL.createObjectURL(blob);

                    // 보이지 않는 <a> 태그를 만들어 다운로드를 실행시킵니다.
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.setAttribute('href', url);
                    a.setAttribute('download', filename);
                    console.log(url + " " + filename);
                    document.body.appendChild(a);
                    a.click();

                    // 임시 URL과 태그를 정리합니다.
                    window.URL.revokeObjectURL(url);
                    a.remove();
                } catch (error) {
                    console.error('다운로드 중 예외 발생:', error);
                    alert('다운로드 중 오류가 발생했습니다. 네트워크 연결을 확인해주세요.');
                }
            });
        }
    </script>
</section>
</body>
</html>
