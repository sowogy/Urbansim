<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<body>
<section class="flex items-center justify-center py-20 px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mb-4">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 11c.828 0 1.5.672 1.5 1.5S12.828 14 12 14s-1.5-.672-1.5-1.5S11.172 11 12 11zm-4-2V7a4 4 0 118 0v2m-9 0h10a2 2 0 012 2v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7a2 2 0 012-2z"/>
                    </svg>
                </div>
                <h1 class="text-2xl text-gray-900 mb-2"><b>비밀번호 변경</b></h1>
            </div>

            <form id="sendForm" th:object="${password}" th:action="@{/password}" method="post" class="space-y-6">
                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <span>기존 비밀번호</span>
                    </label>
                    <input type="password"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{old}"
                           placeholder="기존에 사용하던 패스워드를 입력해주세요.">
                    <p th:if="${#fields.hasErrors('old')}"
                       th:errors="*{old}"
                       class="text-red-600 text-sm mt-1">
                        Old Password Error
                    </p>
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                        </svg>
                        <span>새 비밀번호</span>
                    </label>
                    <input type="password"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{new_password}"
                           placeholder="영문자, 숫자, 특수문자를 포함해 8자 이상 16자 이하로 설정해주세요.">
                    <p th:if="${#fields.hasErrors('new_password')}"
                       th:errors="*{new_password}"
                       class="text-red-600 text-sm mt-1">
                        New Password Error
                    </p>
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                        <span>새 비밀번호 확인</span>
                    </label>
                    <input type="password"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{new_passwordConfirm}"
                           placeholder="새로 설정한 패스워드를 한번 더 입력해주세요.">
                    <p th:if="${#fields.hasErrors('new_passwordConfirm')}"
                       th:errors="*{new_passwordConfirm}"
                       class="text-red-600 text-sm mt-1">
                        New Password Confirm Error
                    </p>
                </div>

                <div class="pt-4">
                    <button type="submit"
                            class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-4 px-4 rounded-xl border-none text-sm cursor-pointer flex items-center justify-center gap-2 shadow-lg transition-all duration-200 hover:from-blue-600 hover:to-indigo-700 hover:shadow-2xl mb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                        </svg>
                        <span>패스워드 변경</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('sendForm').addEventListener('submit', async function(e){
            e.preventDefault(); // 폼 기본 제출 막기

            const form = this;
            // @ModelAttribute를 쓴다면 FormData 사용, @RequestBody를 쓴다면 JSON으로 변환 필요
            // 아래는 FormData 기준 (기존 코드 유지)
            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });

                // 응답 본문(JSON) 파싱
                const data = await response.json();

                if (response.ok) {
                    // [성공 시 로직]
                    // 1. 서버가 준 성공 메시지 출력
                    alert(data.message || "성공적으로 처리되었습니다.");
                    // 2. 자바스크립트가 페이지 이동을 담당 (RedirectAttributes 대체)
                    location.href = "/login";
                } else {
                    // [실패 시 로직] - GlobalExceptionHandler가 준 에러 메시지
                    alert(data.message);
                }
            } catch (error) {
                console.error(error);
                alert('서버 통신 중 오류가 발생했습니다.');
            }
        });
    </script>
</section>
</body>
</html>
