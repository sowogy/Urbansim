<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
</head>
<body>
<section class="max-w-sm mx-auto px-4 py-12">
    <div class="bg-card rounded-2xl shadow-lg p-6">
        <h1 class="mb-6 text-center">비밀번호 변경</h1>

        <form th:object="${password}" th:action="@{/password}" method="post">
            <div class="mb-4">
                <label class="block mb-2 text-foreground">기존 패스워드</label>
                <input
                        type="password"
                        class="w-full px-3 py-2 bg-input-background border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                        th:field="*{old}"
                >
                <p th:if="${#fields.hasErrors('old')}" th:errors="*{old}" class="mt-1 text-sm text-destructive">Old Password Error</p>
            </div>

            <div class="mb-4">
                <label class="block mb-2 text-foreground">새로운 패스워드</label>
                <input
                        type="password"
                        class="w-full px-3 py-2 bg-input-background border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                        th:field="*{new_password}"
                >
                <p th:if="${#fields.hasErrors('new_password')}" th:errors="*{new_password}" class="mt-1 text-sm text-destructive">New Password Error</p>
            </div>

            <div class="mb-6">
                <label class="block mb-2 text-foreground">새로운 패스워드 확인</label>
                <input
                        type="password"
                        class="w-full px-3 py-2 bg-input-background border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                        th:field="*{new_passwordConfirm}"
                >
                <p th:if="${#fields.hasErrors('new_passwordConfirm')}" th:errors="*{new_passwordConfirm}" class="mt-1 text-sm text-destructive">New Password ConfirmError</p>
            </div>

            <button
                    type="submit"
                    class="w-full bg-primary text-primary-foreground rounded-lg py-2.5 px-4 transition-all hover:opacity-90"
            >
                변경
            </button>
        </form>
    </div>
</section>
</body>
</html>
