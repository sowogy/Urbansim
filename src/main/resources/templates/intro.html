<!DOCTYPE html>
<html lang="en"
      th:replace="~{default-board::layout(~{::section})}"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Hero Section -->
<section class="relative min-h-[600px] overflow-hidden">

    <!-- Background Image -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1714601344981-75e003bc5d18?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxtb2Rlcm4lMjBza3lzY3JhcGVyJTIwZ2xhc3MlMjBidWlsZGluZ3xlbnwxfHx8fDE3NzM4MzA5NTN8MA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral"
             alt="현대식 빌딩"
             class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-r from-black/85 via-black/60 to-transparent"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 container mx-auto px-4 py-24 lg:py-32">
        <div class="max-w-2xl space-y-8">

            <!-- Badge -->
            <div class="inline-flex items-center gap-2 rounded-full bg-white/10 backdrop-blur-md border border-white/20 px-5 py-2.5 text-white/90 animate-[fadeInDown_0.6s_ease-out]">
                <span>중앙대학교 도시계획부동산학과</span>
            </div>

            <!-- Heading -->
            <h1 class="text-4xl lg:text-6xl tracking-tight text-white animate-[fadeInUp_0.7s_ease-out]"
                style="line-height:1.2">
                Urbanism
                <span class="block mt-3 bg-gradient-to-r from-sky-400 to-blue-400 bg-clip-text"
                      style="color:transparent; -webkit-background-clip:text">
                    도시를 읽고, 미래를 설계하다
                </span>
            </h1>

            <!-- Feature Cards -->
            <div class="space-y-4 pt-2 animate-[fadeInUp_0.9s_ease-out]">
                <div class="flex items-start gap-4 bg-white/10 backdrop-blur-sm rounded-xl p-5 border border-white/10 transition-all duration-300 hover:bg-white/15 hover:border-white/25 hover:translate-x-1">
                    <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-sky-500/20 shrink-0">
                        <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-white">도시의 계획, 재개발 및 재생에 관한</p>
                        <p class="text-white/80">심도 있는 이해와 통찰</p>
                    </div>
                </div>

                <div class="flex items-start gap-4 bg-white/10 backdrop-blur-sm rounded-xl p-5 border border-white/10 transition-all duration-300 hover:bg-white/15 hover:border-white/25 hover:translate-x-1">
                    <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-sky-500/20 shrink-0">
                        <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-white">강의 속 이론을 현재 부동산 시장 이슈에</p>
                        <p class="text-white/80">직접 적용하고 분석</p>
                    </div>
                </div>
            </div>

            <!-- CTA -->
            <div class="flex flex-col sm:flex-row gap-4 pt-4 animate-[fadeInUp_1.1s_ease-out]">
                <a class="group inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg bg-sky-500 text-white hover:bg-sky-600 h-12 px-8 transition-all duration-300 hover:shadow-lg hover:shadow-sky-500/25"
                   th:href="@{/article/project}">
                    활동 조회하기
                    <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <!-- Keyframes (inline for Thymeleaf compatibility) -->
    <style>
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</section>
</body>
</html>
