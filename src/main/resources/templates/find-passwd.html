<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<body>
<section class="flex items-center justify-center py-20 px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mb-4">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 11c.828 0 1.5.672 1.5 1.5S12.828 14 12 14s-1.5-.672-1.5-1.5S11.172 11 12 11zm-4-2V7a4 4 0 118 0v2m-9 0h10a2 2 0 012 2v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7a2 2 0 012-2z"/>
                    </svg>
                </div>
                <h1 class="text-2xl text-gray-900 mb-2"><b>비밀번호 찾기</b></h1>
                <p class="text-sm text-gray-500">등록된 정보로 비밀번호를 찾으세요</p>
            </div>

            <form id="sendForm" th:object="${findPasswdForm}" th:action="@{/find-passwd}" method="post" class="space-y-6">
                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <span>이메일</span>
                    </label>
                    <input type="email"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{email}"
                           placeholder="등록된 이메일을 입력하세요">
                    <p th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="text-red-600 text-sm mt-1">
                        Email Error
                    </p>
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                        <span>전화번호</span>
                    </label>
                    <input type="text"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{phone}"
                           placeholder="등록된 전화번호를 입력하세요">
                    <p th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}"
                       class="text-red-600 text-sm mt-1">
                        Phone Error
                    </p>
                </div>

                <div class="pt-4">
                    <button type="submit"
                            class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-4 px-4 rounded-xl border-none text-sm cursor-pointer flex items-center justify-center gap-2 shadow-lg transition-all duration-200 hover:from-blue-600 hover:to-indigo-700 hover:shadow-2xl mb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                        </svg>
                        <span>비밀번호 찾기</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('sendForm').addEventListener('submit', async function(e){
            e.preventDefault(); // 폼 기본 제출 막기

            const form = this;
            // @ModelAttribute를 쓴다면 FormData 사용, @RequestBody를 쓴다면 JSON으로 변환 필요
            // 아래는 FormData 기준 (기존 코드 유지)
            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });

                // 응답 본문(JSON) 파싱
                const data = await response.json();

                if (response.ok) {
                    // [성공 시 로직]
                    // 1. 서버가 준 성공 메시지 출력
                    alert(data.message || "성공적으로 처리되었습니다.");
                    // 2. 자바스크립트가 페이지 이동을 담당 (RedirectAttributes 대체)
                    location.href = "/login";
                } else {
                    // [실패 시 로직] - GlobalExceptionHandler가 준 에러 메시지
                    alert(data.message);
                }
            } catch (error) {
                console.error(error);
                alert('서버 통신 중 오류가 발생했습니다.');
            }
        });
    </script>
</section>
</body>
</html>
