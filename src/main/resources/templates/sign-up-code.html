<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{default-board::layout(~{::section})}">
<body>
<section sec:authorize="hasAnyRole('ADMIN')"
         class="min-h-screen bg-white flex items-center justify-center p-4">

    <!-- fadeInUp 애니메이션이 코드에서 사용되므로 정의를 추가 -->
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 12px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
    </style>

    <div class="w-full max-w-3xl">
        <!-- 헤더 -->
        <div class="text-center mb-12">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-6 shadow-lg">
                <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
            </div>
            <h1 class="text-4xl text-gray-900 mb-3">
                <b>회원가입 인증 코드</b>
            </h1>
            <p class="text-gray-600">
                아래 8자리 코드를 회원가입 시 입력해주세요
            </p>
        </div>

        <!-- 메인 카드 -->
        <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12">
            <!-- UUID 표시 영역 -->
            <div class="mb-8">
                <div class="flex items-center justify-center gap-2 mb-6">
                    <div class="bg-blue-600"></div>
                    <span class="text-sm text-gray-500 px-3">인증 코드</span>
                    <div class="bg-blue-600"></div>
                </div>

                <!-- 8개의 사각형 -->
                <div id="uuid-boxes" class="grid grid-cols-4 md:grid-cols-8 gap-3 md:gap-4 mb-8">
                    <!-- JavaScript로 동적 생성 -->
                </div>

                <!-- 전체 코드 표시 -->
                <div class="bg-gray-50 border-2 border-gray-200 rounded-xl p-5 text-center">
                    <p class="text-gray-500 text-sm mb-2">전체 코드</p>
                    <p id="uuid-text" class="text-3xl text-gray-900 tracking-widest" style="font-family: monospace;">
                        <b></b>
                    </p>
                </div>
            </div>

            <!-- 버튼 영역 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button id="copy-btn"
                        class="bg-blue-600 text-white py-4 px-6 rounded-xl shadow-lg transition-all duration-200 hover:from-blue-600 hover:to-cyan-700 hover:shadow-2xl flex items-center justify-center gap-3">
                    <svg id="copy-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    <span id="copy-text">코드 복사하기</span>
                </button>

                <button id="regenerate-btn"
                        class="bg-white border-2 border-gray-300 text-gray-700 py-4 px-6 rounded-xl shadow-lg transition-all duration-200 hover:border-blue-500 hover:bg-blue-50 hover:text-blue-700 hover:shadow-2xl flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    <span>새 코드 생성</span>
                </button>
            </div>

            <!-- 안내 메시지 -->
            <div class="text-center mt-8 p-5 bg-blue-50 border border-blue-200 rounded-xl">
                <p class="text-blue-800 text-sm leading-relaxed">
                    <strong>안내:</strong> 이 코드는 회원가입 시 가입 승인 여부를 확인하기 위해 사용됩니다.
                </p>
            </div>
        </div>
    </div>

    <!-- 핵심: Thymeleaf 값을 JS로 안전하게 주입하려면 th:inline="javascript" -->
    <script th:inline="javascript">
        /*
          authenticate_code가 null/빈값일 수 있으니 기본값 처리.
          [[...]] 는 JS 컨텍스트에 맞게 안전하게 escape/quote 해줍니다.
        */
        const serverCode = /*[[${authenticate_code}]]*/ 'ERROR';
        const safeCode = (serverCode && String(serverCode).trim().length > 0) ? String(serverCode) : 'ERROR';

        // 전역 변수
        let currentUUID = safeCode;
        let copied = false;

        // UUID 박스 렌더링 (서버 코드 기반)
        function renderUUID(uuid) {
            const container = document.getElementById('uuid-boxes');
            container.innerHTML = '';

            // 혹시 길이가 8이 아닐 경우에도 깨지지 않게 방어
            const text = (uuid ?? 'ERROR').toString();

            text.split('').forEach((char, index) => {
                const box = document.createElement('div');
                box.className =
                    'aspect-square bg-gradient-to-br from-blue-600 to-cyan-600 rounded-2xl shadow-lg flex items-center justify-center transform transition-all duration-300 hover:scale-110 hover:shadow-2xl';
                box.style.animation = `fadeInUp 0.5s ease-out ${index * 0.1}s both`;

                const span = document.createElement('span');
                span.className = 'text-white text-3xl md:text-4xl';
                span.innerHTML = `<b>${char}</b>`;

                box.appendChild(span);
                container.appendChild(box);
            });

            // 전체 코드 텍스트 업데이트
            const textElement = document.getElementById('uuid-text');
            textElement.innerHTML = `<b>${text}</b>`;
        }

        //인증 코드 변경
        document.getElementById('regenerate-btn').addEventListener('click', async function(e){
            showLoading();
            e.preventDefault();

            const csrfToken = /*[[${_csrf.token}]]*/ '';
            const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';

            const headers = {
                'Content-Type': 'application/json'
            };

            // 2. 변수에 값이 있으면 헤더에 추가
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

            try{
                const response = await fetch('/changeSignUpCode', {
                    method : 'POST',
                    headers : headers
                });

                const getData = response.json();
                if(response.ok){
                    hideLoading();
                    alert(getData.message || '인증 코드가 변경되었습니다.');
                    window.location.reload();
                } else{
                    hideLoading();
                    alert(getData.message || '인증 코드 변경 중 에러가 발생했습니다.');
                }
            } catch(error){
                console.log(error.message || '알 수 없는 에러 발생')
                hideLoading();
                alert(error.message || '서버와의 연결이 끊겼습니다.')
            }
        });

        // 복사 버튼 상태 초기화
        function resetCopyButton() {
            const copyIcon = document.getElementById('copy-icon');
            const copyText = document.getElementById('copy-text');
            copyIcon.innerHTML =
                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>';
            copyText.textContent = '코드 복사하기';
        }

        async function handleCopy() {
            try {
                // [수정됨] clipboard API가 있으면 쓰고, 없으면 옛날 방식을 쓴다.
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(currentUUID);
                } else {
                    // HTTPS가 아닐 경우 작동하는 구형 방식
                    const textArea = document.createElement("textarea");
                    textArea.value = currentUUID;

                    // 화면 밖으로 보내서 안 보이게 처리
                    textArea.style.position = "fixed";
                    textArea.style.left = "-9999px";
                    document.body.appendChild(textArea);

                    textArea.focus();
                    textArea.select();

                    try {
                        document.execCommand('copy'); // 구형 복사 명령
                    } catch (err) {
                        console.error('Fallback 복사 실패', err);
                        throw err;
                    } finally {
                        document.body.removeChild(textArea);
                    }
                }

                //https 적용 시 해당 코드로 변경
                // async function handleCopy() {
                //     try {
                //         await navigator.clipboard.writeText(currentUUID);
                //         copied = true;
                //
                //         const copyIcon = document.getElementById('copy-icon');
                //         const copyText = document.getElementById('copy-text');

                //         copyIcon.innerHTML =
                //
                //             '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>';
                //
                //         copyText.textContent = '복사 완료!';
                //         setTimeout(() => {
                //             copied = false;
                //             resetCopyButton();
                //         }, 2000);
                //     } catch (err) {
                //         console.error('복사 실패:', err);
                //         alert('복사에 실패했습니다.');
                //     }
                // }

                // --- 성공 처리 로직 (기존과 동일) ---
                copied = true;
                const copyIcon = document.getElementById('copy-icon');
                const copyText = document.getElementById('copy-text');

                copyIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>';
                copyText.textContent = '복사 완료!';

                setTimeout(() => {
                    copied = false;
                    resetCopyButton();
                }, 2000);

            } catch (err) {
                console.error('복사 실패:', err);
                alert('복사에 실패했습니다.');
            }
        }

        // 이벤트 리스너
        document.getElementById('copy-btn').addEventListener('click', handleCopy);

        // 초기 실행
        window.addEventListener('DOMContentLoaded', () => {
            renderUUID(currentUUID);
        });
    </script>
</section>
</body>
</html>
