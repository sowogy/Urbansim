<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>문의 사항</title>
</head>
<body>
<section class="max-w-4xl mx-auto px-4 py-8">
    <!-- 작성 폼 -->
    <div class="bg-white rounded-lg border border-gray-200 shadow-sm">
        <!-- 폼 헤더 -->
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 text-center">
            <h2 class="text-xl font-medium text-gray-900">문의 사항</h2>
        </div>

        <!-- 파일 업로드를 위해 enctype 추가 -->
        <form th:object="${question}" th:action="@{/mail/question}" method="post" class="p-6 space-y-6">
            <!-- 내용 입력 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">내용</label>
                <textarea th:field="*{description}"
                          rows="10"
                          placeholder="최대 500자 작성 가능, 사진 첨부는 dnjsrb8013@naver.com으로 메일 부탁드립니다."
                          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-vertical"></textarea>
                <p th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}"
                   class="mt-2 text-sm text-red-600">Description Error</p>
            </div>

            <!-- 버튼 중앙 정렬을 위한 flex 컨테이너 추가 -->
            <div class="flex justify-center">
                <button type="submit"
                        class="inline-flex items-center px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors shadow-sm">
                    문의하기
                </button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
