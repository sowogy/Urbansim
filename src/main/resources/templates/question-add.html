<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>문의 사항</title>
</head>
<body>
<section class="max-w-4xl mx-auto px-4 py-8">
    <!-- 작성 폼 -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-lg overflow-hidden">
        <!-- 아이콘과 헤더 -->
        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 px-6 py-8 border-b border-gray-200 text-center">
            <!-- 문의 아이콘 (파란색-인디고 그라데이션) -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-2xl font-semibold text-gray-900">문의 사항</h2>
            <p class="mt-2 text-sm text-gray-600">궁금한 점을 자유롭게 문의해주세요</p>
        </div>

        <!-- 파일 업로드를 위해 enctype 추가 -->
        <form id="sendForm" th:object="${question}" th:action="@{/mail/question}" method="post" class="p-8 space-y-6">
            <!-- 내용 입력 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    <span class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        내용
                    </span>
                </label>
                <textarea th:field="*{description}"
                          rows="10"
                          placeholder="최대 500자 작성 가능, 문의 시 본인의 이메일을 남겨야 답장이 가능합니다."
                          class="w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all resize-vertical placeholder:text-gray-400"></textarea>
                <p th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}"
                   class="mt-2 text-sm text-red-600 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Description Error
                </p>
            </div>

            <!-- 안내 박스 -->
            <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-xl p-4">
                <div class="flex gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <div class="text-sm text-gray-700">
                        <p class="font-semibold text-blue-900 mb-1">답변 받기 위한 필수 정보</p>
                        <ul class="space-y-1 text-gray-600">
                            <li>• 문의 내용에 반드시 이메일 주소를 포함해주세요</li>
                            <li>• 이메일 미입력 시 답변을 받으실 수 없습니다</li>
                            <li>• 빠른 답변을 원하시면 구체적으로 작성해주세요</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 버튼 중앙 정렬을 위한 flex 컨테이너 추가 -->
            <div class="flex justify-center pt-2">
                <button type="submit"
                        class="inline-flex items-center gap-2 px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-700 hover:to-indigo-700 transition-all shadow-md hover:shadow-lg font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    문의하기
                </button>
            </div>
        </form>
    </div>
</section>
<script>
    document.getElementById('sendForm').addEventListener('submit', async function(e){
        showLoading();
        e.preventDefault();

        const form = this;
        const formData = new FormData(form);

        const response = await fetch(form.action, {
            method : 'POST',
            body : formData
        });

        try{
            if(response.ok){
                hideLoading();
                alert('문의사항이 접수되었습니다, 메일 주소 미입력시 수신이 불가능하므로 다시 한번 확인 부탁드립니다.');
            } else{
                hideLoading();
                const error = await response.json();
                alert(error.message || '문의사항 접수 중 에러가 발생했습니다.');
            }
        } catch(error){
            hideLoading();
            alert(error.message || '서버와의 연결이 끊겼습니다.');
        }
    });
</script>
</body>
</html>
