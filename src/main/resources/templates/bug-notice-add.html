<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>버그 신고</title>
</head>
<body>
<section class="max-w-4xl mx-auto px-4 py-8">
    <!-- 작성 폼 -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-lg overflow-hidden">
        <!-- 아이콘과 헤더 -->
        <div class="bg-gradient-to-br from-orange-50 to-red-50 px-6 py-8 border-b border-gray-200 text-center">
            <!-- 버그 아이콘 (주황색-빨간색 그라데이션) -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-orange-500 to-red-600 shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h2 class="text-2xl font-semibold text-gray-900">버그 신고</h2>
            <p class="mt-2 text-sm text-gray-600">발견하신 문제를 자세히 알려주세요</p>
        </div>

        <!-- 파일 업로드를 위해 enctype 추가 -->
        <form id="sendForm" th:object="${bugNotice}" th:action="@{/mail/bugNotice}" method="post" class="p-8 space-y-6">
            <!-- 내용 입력 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    <span class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        내용
                    </span>
                </label>
                <textarea th:field="*{description}"
                          rows="10"
                          placeholder="최대 500자 작성 가능, 사진 첨부는 dnjsrb8013@naver.com으로 메일 부탁드립니다."
                          class="w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all resize-vertical placeholder:text-gray-400"></textarea>
                <p th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}"
                   class="mt-2 text-sm text-red-600 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Description Error
                </p>
            </div>

            <!-- 안내 박스 -->
            <div class="bg-gradient-to-r from-orange-50 to-red-50 border border-orange-200 rounded-xl p-4">
                <div class="flex gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-orange-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div class="text-sm text-gray-700">
                        <p class="font-semibold text-orange-900 mb-1">신고 시 도움이 되는 정보</p>
                        <ul class="space-y-1 text-gray-600">
                            <li>• 발생한 문제의 상세한 설명</li>
                            <li>• 문제가 발생한 시간과 위치(URL)</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 버튼 중앙 정렬을 위한 flex 컨테이너 추가 -->
            <div class="flex justify-center pt-2">
                <button type="submit"
                        class="inline-flex items-center gap-2 px-8 py-3 bg-gradient-to-r from-orange-600 to-red-600 text-white rounded-xl hover:from-orange-700 hover:to-red-700 transition-all shadow-md hover:shadow-lg font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    신고하기
                </button>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('sendForm').addEventListener('submit', async function(e){
            showLoading();
            e.preventDefault();

            const form = this;
            const formData = new FormData(form);

            try{
                const response = await fetch(form.action, {
                    method : 'POST',
                    body : formData
                });

                if(response.ok){
                    hideLoading();
                    alert("메일이 성공적으로 전송되었습니다.");
                    window.location.href="/mail/bugNotice";
                }
                else if(!response.ok){
                    const errorData = response.json();
                    hideLoading();
                    alert(errorData.message || '사용자 요청 처리 중 에러가 발생했습니다.');
                }
            } catch(error){
                console.log(error);
                hideLoading();
                alert('서버와 연결할 수 없습니다. 인터넷 연결을 확인해보세요.');
            }
        });
    </script>
</section>
</body>
</html>
