<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의사항 접수</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6;">
<div style="max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); overflow: hidden;">
    <!-- 헤더 -->
    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px 30px; text-align: center;">
        <div style="width: 60px; height: 60px; background-color: rgba(255, 255, 255, 0.2); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
            <svg style="width: 32px; height: 32px; color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
        </div>
        <h1 style="margin: 0; color: white; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">
            문의사항 접수 안내
        </h1>
        <p style="margin: 10px 0 0 0; color: rgba(255, 255, 255, 0.9); font-size: 16px;">
            Urbanism 사이트
        </p>
    </div>

    <!-- 본문 -->
    <div style="padding: 40px 30px;">
        <!-- 접수 확인 메시지 -->
        <div style="margin-bottom: 30px; padding: 20px; background-color: #d1fae5; border-radius: 8px; border: 1px solid #a7f3d0;">
            <p style="margin: 0; color: #065f46; font-size: 15px; line-height: 1.6; text-align: center;">
                <strong>문의사항이 정상적으로 접수되었습니다.</strong><br>
            </p>
        </div>

        <!-- 접수 일시 -->
        <div style="margin-bottom: 30px;">
            <div style="display: inline-block; background-color: #e0e7ff; padding: 8px 16px; border-radius: 20px; margin-bottom: 10px;">
                    <span style="color: #3730a3; font-size: 14px; font-weight: 500;">
                        접수 일시
                    </span>
            </div>
            <p style="margin: 0; color: #1f2937; font-size: 16px; font-weight: 600;" th:text="${date}">
                2025-12-17 14:30:00
            </p>
        </div>

        <!-- 구분선 -->
        <div style="height: 1px; background-color: #e5e7eb; margin: 30px 0;"></div>

        <!-- 문의 내용 -->
        <div>
            <div style="display: inline-block; background-color: #fef3c7; padding: 8px 16px; border-radius: 20px; margin-bottom: 15px;">
                    <span style="color: #92400e; font-size: 14px; font-weight: 500;">
                        문의 내용
                    </span>
            </div>
            <div style="background-color: #f9fafb; padding: 25px; border-radius: 12px; border: 1px solid #e5e7eb;">
                <p style="margin: 0; color: #374151; font-size: 15px; line-height: 1.8; white-space: pre-wrap;" th:text="${description}">
                    문의 내용이 여기에 표시됩니다.
                </p>
            </div>
        </div>
    </div>

    <!-- 푸터 -->
    <div style="background-color: #f9fafb; padding: 25px 30px; text-align: center; border-top: 1px solid #e5e7eb;">
        <p style="margin: 0; color: #6b7280; font-size: 13px;">
            이 메일은 Urbanism 문의사항 접수에 대한 메일입니다.
        </p>
        <p style="margin: 8px 0 0 0; color: #9ca3af; font-size: 12px;">
            © 2025 Urbanism. All rights reserved.
        </p>
    </div>
</div>
</body>
</html>
