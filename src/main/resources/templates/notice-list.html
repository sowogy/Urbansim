<!DOCTYPE html>
<html lang="ko" th:replace="~{default-board::layout(~{::section})}"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>
<section class="max-w-6xl mx-auto px-4 py-8">
    <!-- 게시판 헤더 -->
    <div class="mb-8">
        <div class="flex items-center gap-3 mb-2">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl shadow-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
            </div>
            <h1 class="text-3xl text-gray-900"><b>공지사항</b></h1>
        </div>
        <p class="text-gray-600 ml-15">중요한 소식과 업데이트를 확인하세요</p>
    </div>

    <!-- 공지사항 테이블 -->
    <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-xl">
        <table class="w-full">
            <thead class="bg-gradient-to-r from-gray-50 to-gray-100 border-b-2 border-gray-200">
            <tr>
                <th class="px-6 py-4 text-left text-xs text-gray-600 uppercase tracking-wider w-20">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/>
                        </svg>
                    </div>
                </th>
                <th class="px-6 py-4 text-left text-xs text-gray-600 uppercase tracking-wider">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <span>제목</span>
                    </div>
                </th>
                <th class="px-6 py-4 text-left text-xs text-gray-600 uppercase tracking-wider w-32">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span>작성자</span>
                    </div>
                </th>
                <th class="px-6 py-4 text-left text-xs text-gray-600 uppercase tracking-wider w-40">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>수정날짜</span>
                    </div>
                </th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="notice : ${page.content}" class="hover:bg-blue-50/50 transition-all duration-200 group">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${notice.id}">id</td>
                <td class="px-6 py-4">
                    <a th:text="${notice.title}"
                       th:href="@{/notice/content(id=${notice.id})}"
                       class="text-gray-900 hover:text-blue-600 transition-colors inline-flex items-center gap-2 group-hover:underline">title</a>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${notice.name}">author</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                    th:text="${#calendars.format(notice.updated, 'yyyy-MM-dd HH:mm:ss')}">2025-08-13 11:52:56</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 및 글쓰기 버튼 -->
    <div th:if="${!page.isEmpty()}">
        <!-- 상단: 게시글 개수와 글쓰기 버튼 -->
        <div class="flex items-center justify-between mt-8">
            <div class="flex items-center gap-2 text-sm text-gray-600">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                총 <span class="text-blue-600" th:text="${page.totalElements}">0</span>개의 공지사항
            </div>

            <!-- 글쓰기 버튼 -->
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/notice/add}"
                   class="inline-flex items-center gap-2 px-5 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl hover:from-blue-600 hover:to-indigo-700 transition-all duration-200 shadow-lg hover:shadow-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>공지사항 작성</span>
                </a>
            </div>
        </div>

        <!-- 중앙: 페이지네이션 -->
        <nav class="flex items-center justify-center space-x-1 mt-6"
             th:with="start=${T(java.lang.Math).floor(page.number / 5) * 5},
             last=(${start + 4 < page.totalPages ? start + 4 : page.totalPages - 1})">
            <!-- 이전 페이지 버튼 -->
            <a th:href="@{/notice/list(page=${page.number - 1})}"
               class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
               th:classappend="${page.first} ? 'opacity-50 cursor-not-allowed pointer-events-none'"
               aria-label="Previous">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>

            <!-- 페이지 번호들 -->
            <a th:each="pageNumber: ${#numbers.sequence(start, last)}"
               th:text="${pageNumber + 1}"
               th:href="@{/notice/list(page=${pageNumber})}"
               class="px-3 py-2 text-sm font-medium border rounded-md transition-colors"
               th:classappend="${pageNumber == page.number} ? 'bg-blue-600 text-white border-blue-600' : 'text-gray-700 bg-white border-gray-300 hover:bg-gray-50'">1</a>

            <!-- 다음 페이지 버튼 -->
            <a th:href="@{/notice/list(page=${page.number + 1})}"
               class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
               th:classappend="${page.last} ? 'opacity-50 cursor-not-allowed pointer-events-none'"
               aria-label="Next">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </a>
        </nav>
    </div>

    <!-- 빈 상태 메시지 -->
    <div th:if="${page.isEmpty()}" class="text-center py-16 bg-white rounded-2xl border border-gray-200 shadow-xl">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-gray-100 to-gray-200 rounded-2xl mb-4">
            <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
        </div>
        <h3 class="text-xl text-gray-900 mb-2"><b>공지사항이 없습니다</b></h3>
        <p class="text-gray-500 mb-6">아직 등록된 공지사항이 없습니다.</p>
        <a th:href="@{/notice/add}"
           sec:authorize="hasRole('ADMIN')"
           class="inline-flex items-center gap-2 px-5 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl hover:from-blue-600 hover:to-indigo-700 transition-all duration-200 shadow-lg hover:shadow-xl">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            <span>공지사항 작성</span>
        </a>
    </div>
</section>
</body>
</html>
