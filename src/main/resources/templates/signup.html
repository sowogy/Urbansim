<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<section class="max-w-md mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-8">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-medium text-gray-900">회원가입</h1>
        <p class="text-gray-600 mt-2">새 계정을 만들어 커뮤니티에 참여하세요</p>
    </div>

    <form th:object="${member}" th:action="@{/signup}" method="post" class="space-y-6">
        <div>
            <label class="block text-gray-700 font-medium mb-2">이름</label>
            <input type="text"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   th:field="*{name}"
                   placeholder="이름을 입력하세요">
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-sm mt-1">Name Error</p>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-2">이메일</label>
            <input type="email"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   th:field="*{email}"
                   placeholder="이메일을 입력하세요">
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm mt-1">Email Error</p>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-2">비밀번호</label>
            <input type="password"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   th:field="*{passwd}"
                   placeholder="비밀번호 설정(특수문자를 포함한 영문자 8자 이상 16자 이하로 설정)">
            <p th:if="${#fields.hasErrors('passwd')}" th:errors="*{passwd}" class="text-red-600 text-sm mt-1">Password Error</p>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-2">비밀번호 확인</label>
            <input type="password"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   th:field="*{passwdConfirm}"
                   placeholder="비밀번호를 다시 입력하세요">
            <p th:if="${#fields.hasErrors('passwdConfirm')}" th:errors="*{passwdConfirm}" class="text-red-600 text-sm mt-1">Password Confirm Error</p>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-2">전화번호</label>
            <input type="text"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   th:field="*{phone}"
                   placeholder="전화번호를 입력하세요">
            <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-red-600 text-sm mt-1">Phone Error</p>
        </div>

        <div class="pt-4">
            <button type="submit"
                    class="w-full inline-flex items-center justify-center px-6 py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors shadow-sm">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                생성
            </button>
        </div>

        <div th:if="${error_message}" class="alert-danger" role="alert">
            <p th:text="${error_message}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <div class="text-center pt-4 border-t border-gray-200">
            <p class="text-gray-600 text-sm mb-3">이미 계정이 있으신가요?</p>
            <a th:href="@{/login}"
               class="inline-flex items-center px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
                로그인 하러 가기
            </a>
        </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function showSignupSuccess() {
            Swal.fire({
                title: "회원가입이 완료되었습니다",
                icon: "success",
                showCancelButton: true,
                confirmButtonColor: "#3085d6",
                cancelButtonColor: "#d33",
                confirmButtonText: "로그인"
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = "/login";
                }
            });
        }
    </script>
    <!-- signSuccess가 true일 때만 호출됨 -->
    <script th:if="${signSuccess}">
        // 라이브러리와 함수가 로드된 뒤에 실행되도록 보수적으로 감싸도 됨
        window.addEventListener('DOMContentLoaded', () => showSignupSuccess());
    </script>
</section>
</body>
</html>
