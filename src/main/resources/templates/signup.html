<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<section class="flex items-center justify-center py-20 px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mb-4">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <h1 class="text-2xl text-gray-900 mb-2"><b>회원가입</b></h1>
                <p class="text-gray-600 text-sm">새 계정을 만들어 커뮤니티에 참여하세요</p>
            </div>

            <form th:object="${member}" th:action="@{/signup}" id="sendForm" method="post" class="space-y-6">
                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span>이름</span>
                    </label>
                    <input type="text"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{name}"
                           placeholder="이름을 입력하세요">
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <span>이메일</span>
                    </label>
                    <div class="flex gap-2">
                        <input type="email" id="emailInput"
                               class="flex-1 py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                               th:field="*{email}"
                               placeholder="이메일을 입력하세요">
                        <a th:href="@{/mail/emailAuthenticationCode}"
                           id="emailVerifyBtn"
                           class="inline-block px-6 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl text-sm cursor-pointer shadow-lg transition-all duration-200 hover:from-blue-600 hover:to-indigo-700 hover:shadow-xl whitespace-nowrap">
                            인증 요청
                        </a>
                    </div>

                    <!-- 이메일 인증번호 입력 영역 가입된 이메일있는지 여부 확인 후 보여잠 -->
                    <div id="emailVerifySection" class="hidden mt-4">
                        <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                            <svg id="verifyIcon" class="w-5 h-5 text-red-500 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /> </svg>
                            <span>이메일 인증번호</span>
                            <div id="emailTimer" class="flex items-center px-4 py-3 text-red-600 text-sm whitespace-nowrap">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                <span id="timerText">3:00</span>
                            </div>
                        </label>
                        <div class="flex gap-2">
                            <input type="text" id="emailVerifyCode"
                               class="flex-1 py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                                   placeholder="인증번호를 입력하세요">
                            <a th:href="@{/mail/emailAuthentication}" id="emailVerifyConfirmBtn"
                               class="px-6 py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl text-sm cursor-pointer shadow-lg transition-all duration-200 hover:from-green-600 hover:to-emerald-700 hover:shadow-xl whitespace-nowrap">
                                인증 확인
                            </a>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                        </svg>
                        <span>비밀번호</span>
                    </label>
                    <input id="passwordInput" type="password"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{passwd}"
                           placeholder="비밀번호 설정">
                    <p id="passwordHelp" class="text-sm text-blue-600 mt-1 hidden">
                        ※ 최소 8자 이상 256자 이하로 구성<br>
                        ※ 영어 대소문자, 숫자, 특수문자로 구성<br>
                        ※ 특수문자(~!@#$%^&*) 하나 이상 포함
                    </p>
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                        <span>비밀번호 확인</span>
                    </label>
                    <input type="password"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{passwdConfirm}"
                           placeholder="비밀번호를 다시 입력하세요">
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                        <span>전화번호</span>
                    </label>
                    <input
                            type="text"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{phone}"
                           placeholder="전화번호를 입력하세요 예)01011112222">
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
                        </svg>
                        <span>회원가입 인증코드</span>
                    </label>
                    <input type="password"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{authenticate_code}"
                           placeholder="사이트 관리자에게 발급받은 인증코드를 입력해 주세요.">
                </div>

                <div class="pt-4">
                    <button type="submit"
                            class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-4 px-4 rounded-xl border-none text-sm cursor-pointer flex items-center justify-center gap-2 shadow-lg transition-all duration-200 hover:from-blue-600 hover:to-indigo-700 hover:shadow-2xl mb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span>계정 생성</span>
                    </button>
                </div>
                <div class="pt-2 border-t border-gray-200 mt-4">
                    <p class="text-sm text-gray-600 text-center">카카오 계정이 있으신가요?</p>
                    <div class="pt-2 flex justify-center w-full">
                        <a th:href="@{/oauth2/authorization/kakao}">
                            <img th:src="@{/image/kakao_login_medium_wide.png}"
                                 alt="카카오 로그인"
                                 class="hover:opacity-90 transition-opacity duration-200"> </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let emailConfig = false; //이메일 인증 여부

        const pwInput = document.getElementById('passwordInput');
        const pwHelp = document.getElementById('passwordHelp');

        // 포커스 되면 도움말 보여주기
        pwInput.addEventListener('focus', function() {
            pwHelp.classList.remove('hidden');
        });

        // 포커스 벗어나면(blur) 도움말 숨기기
        pwInput.addEventListener('blur', function() {
            pwHelp.classList.add('hidden');
        });

        // 이메일 인증 요청 버튼 클릭 이벤트
        document.getElementById('emailVerifyBtn').addEventListener('click', async function(e) {
            showLoading();
            e.preventDefault();

            emailConfig = false; //이메일 인증 코드 요청 시 false로 초기화

            const emailInput = document.getElementById('emailInput').value;
            if (!emailInput.trim()) {
                hideLoading();
                alert("이메일을 입력해주세요.");
                document.getElementById('emailInput').focus();
                return;
            }

            const url = this.href + "?email="+encodeURIComponent(emailInput);

            try{
                const response = await fetch(url, {
                    method : "GET",
                    headers : {
                        'Accept' : 'application/json, text/html'
                    }
                });

                const getData = await response.json();
                if(response.ok){
                    hideLoading();
                    const emailVerifySection = document.getElementById('emailVerifySection');
                    emailVerifySection.classList.remove('hidden');

                    // 3분 타이머 시작
                    let timeLeft = 180; // 3분 = 180초
                    const timerText = document.getElementById('timerText');

                    const countdown = setInterval(function() {
                        const minutes = Math.floor(timeLeft / 60);
                        const seconds = timeLeft % 60;
                        timerText.textContent = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;

                        if (timeLeft <= 0) {
                            clearInterval(countdown);
                            timerText.textContent = '유효 시간 만료';
                        }
                        timeLeft--;
                    }, 1000);

                    alert(getData.message || '입력하신 이메일로 인증 코드를 전송하였습니다.');
                } else{
                    hideLoading();
                    alert(getData.message || '이미 사용중인 이메일입니다.');
                }
            } catch(error){
                hideLoading();
                alert(error.message || '서버와의 연결이 끊겼습니다.');
            }
        });

        //이메일 인증 버튼 클릭 이벤트
        document.getElementById('emailVerifyConfirmBtn').addEventListener('click', async function(e){
            showLoading();
            e.preventDefault();
            const icon = document.getElementById('verifyIcon');

            const code = document.getElementById('emailVerifyCode').value;
            if(!code.trim()){
                hideLoading();
                alert("인증 코드를 입력해주세요.");
                return;
            }
            const url = this.href + "?authenticationCode="+ encodeURIComponent(code);

            try{
                const response = await fetch(url, {
                    method : 'GET',
                    headers : {
                        'Accept' : 'application/json, text/html'
                    }
                });

                const getData = await response.json();
                if(response.ok){
                    hideLoading();
                    alert("이메일 인증이 완료되었습니다.");
                    // 아이콘 변경 (붉은 느낌표 -> 초록 체크표시)
                    icon.classList.replace('text-red-500', 'text-green-500');
                    // 체크 아이콘 path로 교체
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>';
                    emailConfig = true;
                } else{
                    hideLoading();
                    alert(getData.message || "인증 코드가 틀립니다.");
                    document.getElementById('emailVerifyCode').focus();
                }
            } catch(error){
                hideLoading();
                alert(error.message || '서버와의 연결이 끊겼습니다.');
            }
        });

        function showSignupSuccess() {
            Swal.fire({
                title: "회원가입이 완료되었습니다",
                icon: "success",
                showCancelButton: true,
                confirmButtonColor: "#3085d6",
                cancelButtonColor: "#d33",
                confirmButtonText: "로그인하기"
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = "/login";
                }
            });
        }

        document.getElementById('sendForm').addEventListener('submit', async function(e){
            showLoading();
            e.preventDefault();

            //이메일 미인증 시 회원가입 차단
            if(!emailConfig){
                hideLoading();
                alert("이메일을 인증해주세요.");
                return;
            }

            const form = this;
            const formData = new FormData(form);

            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

            const headers = {};
            if(csrfToken ** csrfHeader){
                headers[csrfHeader] = csrfToken;
            }
            try{
                const response = await fetch(form.action, {
                    method : 'POST',
                    headers : headers,
                    body : formData
                });

                const contentType = response.headers.get("content-type");

                if(contentType && contentType.includes("application/json")){
                    const getData = await response.json();
                    if(response.ok){
                        hideLoading();
                        showSignupSuccess();
                    } else{
                        hideLoading();
                        alert(getData.message || '회원가입 도중 에러가 발생했습니다.');
                    }
                } else{
                    hideLoading();
                    alert("비정상적인 응답이 발생했습니다.");
                }
            } catch(error){
                hideLoading();
                alert(error.message || '서버와의 연결이 끊겼습니다.');
            }
        });
    </script>
</section>
</body>
</html>
