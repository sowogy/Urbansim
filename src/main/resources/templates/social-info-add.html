<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <script th:src="@{/js/loader.js}" defer></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">
<section class="flex items-center justify-center py-20 px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mb-4">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <h1 class="text-2xl text-gray-900 mb-2"><b>회원가입</b></h1>
                <p class="text-gray-600 text-sm">간편 로그인을 위해 추가 정보를 입력해주세요</p>
            </div>

            <form id="sendForm" th:object="${socialMemberForm}" th:action="@{/socialInfoAdd}" method="post" class="space-y-6">
                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span>이름</span>
                    </label>
                    <input id="nameInput" type="text"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{name}"
                           placeholder="이름을 입력하세요">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-sm mt-1">Name Error</p>
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                        <span>전화번호</span>
                    </label>
                    <input type="text" maxlength="11"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{phone}"
                           placeholder="전화번호를 입력하세요 ('-' 제외)">
                    <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-red-600 text-sm mt-1">Phone Error</p>
                </div>

                <div>
                    <label class="flex items-center gap-2 text-gray-700 mb-3 text-sm">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                        </svg>
                        <span>인증 코드</span>
                    </label>
                    <input type="text"
                           class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 text-sm appearance-none cursor-text transition-all duration-200 hover:border-blue-300 hover:bg-blue-50/50 focus:outline-none focus:border-blue-500 focus:bg-blue-50 focus:text-blue-800"
                           th:field="*{authenticate_code}"
                           placeholder="인증 코드를 입력하세요.">
                    <p th:if="${#fields.hasErrors('authenticate_code')}" th:errors="*{authenticate_code}" class="text-red-600 text-sm mt-1">Authenticate_code Error</p>
                </div>

                <div th:if="${error_message}" class="alert-danger" role="alert">
                    <p th:text="${error_message}" class="text-red-600 text-sm mt-1"></p>
                </div>

                <div class="pt-4">
                    <button type="submit"
                            class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-4 px-4 rounded-xl border-none text-sm cursor-pointer flex items-center justify-center gap-2 shadow-lg transition-all duration-200 hover:from-blue-600 hover:to-indigo-700 hover:shadow-2xl mb-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span>계정 생성</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
    <script>
        const nameInput = document.getElementById('nameInput');
        window.addEventListener('DOMContentLoaded', () => {
            nameInput.focus();
        });

        document.getElementById('sendForm').addEventListener('submit', async function(e){
            showLoading();
            e.preventDefault();
            const name = document.getElementById('nameInput').value;
            if(name === 'temp'){
                hideLoading();
                alert('사용할 수 없는 이름입니다. 다른 이름을 입력해주세요.');
                return;
            }

            const form = this;
            const formData = new FormData(form);

            try{
                const response = await fetch(form.action, {
                    method : 'POST',
                    body : formData
                });

                if(response.ok){
                    hideLoading();
                    alert('회원가입이 완료되었습니다.');
                    window.location.href="/";
                } else{
                    hideLoading();
                    const errorData = await response.json();
                    alert(errorData.message || '회원가입 도중 에러가 발생했습니다, 다시 시도해주세요.');
                }
            } catch(error){
                console.log(error);
                hideLoading();
                alert(error.message || '서버와의 연결이 끊겼습니다.');
            }
        })
    </script>
</section>
</body>
</html>
