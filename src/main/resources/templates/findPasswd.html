<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:replace="~{default-board::layout(~{::section})}">
<body>
<section class="max-w-md mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-8">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-medium text-gray-900">비밀번호 찾기</h1>
    </div>

    <form th:object="${findPasswdForm}" th:action="@{/findpasswd}" method="post" class="space-y-6">
        <div>
            <label class="block text-gray-700 font-medium mb-2">이메일</label>
            <input type="email"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   th:field="*{email}"
                   placeholder="등록된 이메일을 입력하세요">
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm mt-1">Email Error</p>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-2">전화번호</label>
            <input type="text"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   th:field="*{phone}"
                   placeholder="등록된 전화번호를 입력하세요">
            <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-red-600 text-sm mt-1">Phone Error</p>
        </div>

        <div class="pt-4">
            <button type="submit"
                    class="w-full inline-flex items-center justify-center px-6 py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors shadow-sm">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m0 0a2 2 0 01-2 2m2-2h3a1 1 0 011 1v1a1 1 0 01-1 1h-3m-2-2V5a2 2 0 00-2-2H9a2 2 0 00-2 2v2m0 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 00-2-2H9a2 2 0 00-2 2v2"/>
                </svg>
                비밀번호 찾기
            </button>
        </div>
    </form>

    <!-- 성공 메시지 -->
    <div th:if="${findSuccess == true}" class="mt-8 text-center bg-green-50 border border-green-200 rounded-lg p-6">
        <div class="flex justify-center mb-4">
            <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <p class="text-green-800 font-medium mb-2">이메일로 임시 비밀번호 전송</p>
        <p class="text-green-600 text-sm mb-6">등록된 이메일 주소로 임시 비밀번호를 발송했습니다.</p>
        <h3 class="my-4"></h3>
        <a th:href="@{/login}"
           class="inline-flex items-center px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors shadow-sm">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
            로그인 하러 가기
        </a>
    </div>

    <!-- 실패 메시지 -->
    <div th:if="${findSuccess == false}" class="mt-8 text-center bg-red-50 border border-red-200 rounded-lg p-6">
        <div class="flex justify-center mb-4">
            <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
        </div>
        <p class="text-red-800 font-medium mb-2">회원 조회 실패</p>
        <p class="text-red-600 text-sm">입력하신 정보와 일치하는 회원이 없습니다. 다시 확인해 주세요.</p>
        <h3 class="my-4"></h3>
    </div>
</section>
</body>
</html>
