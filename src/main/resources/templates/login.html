<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Urbanism</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --focus-color: #38a3ff;
            --box-border: #d9e0e6;
            --label-color: #8c98a4;
            --green: #14ae5c;
            --green-hover: #0f9b50;
            --field-bg: #fff;
        }
        body { background: #f5f7fa; }
        .login-wrap { max-width: 420px; margin: 56px auto; }

        .stacked-input {
            position: relative;
            border: 1.5px solid var(--box-border);
            border-radius: 16px;
            background: var(--field-bg);
            overflow: hidden;
        }
        .stacked-input .rowline {
            position: relative;
            padding: 18px 16px 10px 16px;
        }
        .stacked-input .rowline + .rowline {
            border-top: 1px solid #eef2f6;
            padding-top: 20px;
        }
        .floating-label {
            position: absolute;
            left: 16px;
            top: 16px;
            font-size: 12px;
            color: var(--label-color);
            transition: all .15s ease;
            pointer-events: none;
        }
        .stacked-input input.form-control {
            border: none !important;
            background: transparent;
            padding: 2px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
            box-shadow: none !important;
        }
        .stacked-input:has(input:focus) {
            border-color: var(--focus-color);
            box-shadow: 0 0 0 4px rgba(56,163,255,.12);
        }

        .btn-login {
            width: 100%;
            max-width: 420px;
            background: #444;         /* 검은 배경 */
            color: #fff;              /* 흰 글자 */
            border: none;
            border-radius: 14px;
            font-weight: 800;
            padding: 14px 16px;
            font-size: 18px;
            display: block;
            margin: 0 auto;
            transition: background-color .15s ease, opacity .15s ease;
        }
        .btn-login:hover {
            background: #666;         /* 살짝 밝은 블랙로 호버 효과 */
        }


        .section-divider {
            border: none;
            border-top: 1px solid #666;
            margin: 20px 0;
        }

        .sub-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            color: #6c757d;
            font-size: 14px;
            max-width: 420px;
            margin: 0 auto;
        }
        .sub-links a { color: #6c757d; text-decoration: none; }
        .sub-links a:hover { text-decoration: underline; }
        .sub-links .divider { color: #6c757d; }

        /* === Tailwind 느낌 알림 === */
        .tw-alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;              /* rounded-lg */
            border: 1px solid #fecaca;        /* red-200 */
            background: #fef2f2;              /* red-50 */
            color: #991b1b;                   /* red-800 */
            font-size: 14px;                  /* text-sm */
            line-height: 1.45;
            box-shadow: 0 1px 2px rgba(0,0,0,.04);
            animation: tw-fade-in .18s ease-out;
        }
        .tw-alert .tw-alert-icon {
            color: #ef4444;                   /* red-500 */
            margin-top: 2px;
            font-size: 18px;
        }
        .tw-alert .tw-alert-text {
            flex: 1 1 auto;
            word-break: break-word;
        }
        .tw-alert .tw-alert-close {
            appearance: none;
            border: 0;
            background: transparent;
            color: #b91c1c;                   /* red-700 */
            font-size: 20px;
            line-height: 1;
            padding: 0 2px;
            margin-left: 8px;
            cursor: pointer;
            opacity: .75;
            transition: opacity .15s ease;
        }
        .tw-alert .tw-alert-close:hover { opacity: 1; }

        /* 포커스 링 (focus-visible) */
        .tw-alert:focus-within {
            outline: 0;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, .15); /* red-500/15 */
        }

        /* 에러 타입 프리셋(확장 대비) */
        .tw-alert-error {
            border-color: #fecaca;            /* red-200 */
            background: #fef2f2;              /* red-50 */
            color: #991b1b;                   /* red-800 */
        }
    </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center">

<div class="card shadow-sm" style="border-radius: 20px; width: 500px; max-width: 96vw;">
    <ul class="nav nav-tabs nav-fill px-2 pt-2" id="loginTabs" role="tablist" style="border-top-left-radius:20px;border-top-right-radius:20px;">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="email-tab" data-bs-toggle="tab" data-bs-target="#email-pane" type="button" role="tab">
                <i class="fa-solid fa-at me-1"></i> 이메일 로그인
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="social-tab" data-bs-toggle="tab" data-bs-target="#social-pane" type="button" role="tab">
                <i class="fa-solid fa-users me-1"></i> 소셜 로그인
            </button>
        </li>
    </ul>

    <div class="tab-content p-4">
        <!-- 이메일 로그인 탭 -->
        <div class="tab-pane fade show active" id="email-pane" role="tabpanel" aria-labelledby="email-tab">
            <div class="container login-wrap p-0" style="margin:0 auto;">
                <form th:action="@{/login}" method="post" novalidate>
                    <div class="stacked-input mb-3">
                        <div class="rowline">
                            <label class="floating-label" for="username">이메일</label>
                            <input type="text" class="form-control" id="username" name="username" autocomplete="username">
                        </div>
                        <div class="rowline">
                            <label class="floating-label" for="password">비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login" id="login-btn">로그인</button>

                    <div th:if="${error_message}"
                         class="tw-alert tw-alert-error mt-3"
                         role="alert" aria-live="assertive">
                        <i class="fa-solid fa-circle-exclamation tw-alert-icon" aria-hidden="true"></i>
                        <div class="tw-alert-text" th:text="${error_message}">로그인에 실패했습니다.</div>
                    </div>


                    <hr class="section-divider">

                    <div class="sub-links">
                        <a th:href="@{/findid}">이메일 찾기</a>
                        <span class="divider">|</span>
                        <a th:href="@{/findpasswd}">비밀번호 찾기</a>
                        <span class="divider">|</span>
                        <a th:href="@{/signup}">회원가입</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 소셜 로그인 탭 -->
        <div class="tab-pane fade" id="social-pane" role="tabpanel" aria-labelledby="social-tab">
            <div class="container p-0" style="max-width:420px;">
                <div class="d-grid gap-2 text-center">
                    <a th:href="@{/oauth2/authorization/kakao}">
                        <!-- 경로 오타 수정: image/image -> image -->
                        <img th:src="@{/image/kakao_login_medium_wide.png}" alt="카카오 로그인">
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<script>
    // 소셜 로그인 실패 시 경고 → 회원가입 유도
    function showNeedSignup() {
        Swal.fire({
            title: "회원정보가 존재하지 않습니다",
            text: "회원가입을 진행하시겠습니까?",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#3085d6",
            cancelButtonColor: "#d33",
            confirmButtonText: "회원가입",
            cancelButtonText: "취소"
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "/signup";
            }
        });
    }

    // 입력 지우기 버튼(옵션)
    document.querySelectorAll('[data-clear]').forEach(function(btn){
        btn.addEventListener('click', function(){
            const sel = btn.getAttribute('data-clear');
            const el = document.querySelector(sel);
            if (el) { el.value = ''; el.focus(); }
        });
    });

    // 비밀번호 보이기/가리기(옵션)
    document.querySelectorAll('[data-toggle-password]').forEach(function(btn){
        btn.addEventListener('click', function(){
            const sel = btn.getAttribute('data-toggle-password');
            const el = document.querySelector(sel);
            if (!el) return;

            const icon = btn.querySelector("i");
            if (el.type === 'password') {
                el.type = 'text';
                if (icon) icon.className = "fa-solid fa-eye-slash";
                btn.setAttribute('aria-label', '비밀번호 가리기');
            } else {
                el.type = 'password';
                if (icon) icon.className = "fa-solid fa-eye";
                btn.setAttribute('aria-label', '비밀번호 보이기');
            }
            el.focus();
        });
    });

    // 플로팅 라벨 위치 동기화
    function syncFloatingLabel(input) {
        const label = input.closest('.rowline')?.querySelector('.floating-label');
        if (!label) return;
        if (input.value && input.value.trim() !== '') {
            label.style.top = '2px';
            label.style.fontSize = '11px';
            label.style.color = '#8c98a4';
        } else {
            label.style.top = '4px';
            label.style.fontSize = '12px';
            label.style.color = '#8c98a4';
        }
    }
    document.querySelectorAll('.stacked-input input').forEach(function(input){
        ['input','change','blur','keyup'].forEach(evt =>
            input.addEventListener(evt, () => syncFloatingLabel(input))
        );
        syncFloatingLabel(input);
    });
</script>
<script th:if="${success == false}">
    window.addEventListener('DOMContentLoaded', function () {
        showNeedSignup();
    });
</script>
</body>
</html>
