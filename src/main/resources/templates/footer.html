<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      th:fragment="footer">
<head>
    <meta charset="UTF-8">
    <title>Footer</title>
</head>
<body>
<!-- Footer Fragment -->
<footer class="bg-gray-50 border-t border-gray-200"
        th:fragment="footer">
    <div class="max-w-7xl mx-auto px-6 py-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- 브랜드 섹션 -->
            <div class="space-y-4">
                <div class="flex items-center space-x-2">
                    <!-- MessageCircle 아이콘 -->
                    <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <span class="text-xl font-medium text-gray-900">커뮤니티 게시판</span>
                </div>
                <p class="text-gray-600 leading-relaxed">
                    모든 사람이 자유롭게 소통할 수 있는 열린 공간을 만들어갑니다.
                </p>
                <div class="flex space-x-2">
                    <!-- Instagram 버튼 -->
                    <a href="https://www.instagram.com/urbanism_cau/" class="inline-flex items-center justify-center w-8 h-8 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-md transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                    <!-- Mail 버튼 -->
                    <a th:href="@{/mail/question}" class="inline-flex items-center justify-center w-8 h-8 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-md transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M3 8l7.89 7.89a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- 빠른 링크 -->
            <div>
                <h4 class="font-medium text-gray-900 mb-4">빠른 링크</h4>
                <div class="space-y-2">
                    <a th:href="@{/article/list}" class="block text-gray-600 hover:text-gray-900 transition-colors">
                        최신 글
                    </a>
                </div>
            </div>

            <!-- 커뮤니티 -->
            <div>
                <h4 class="font-medium text-gray-900 mb-4">커뮤니티</h4>
                <div class="space-y-2">
                    <a th:href="@{/notice/list}" class="block text-gray-600 hover:text-gray-900 transition-colors">
                        공지사항
                    </a>
                    <a href="#" class="block text-gray-600 hover:text-gray-900 transition-colors">
                        문의하기
                    </a>
                    <a th:href="@{/mail/bugNotice}" class="block text-gray-600 hover:text-gray-900 transition-colors">
                        버그 신고
                    </a>
                </div>
            </div>
        </div>

        <!-- 구분선 -->
        <div class="border-t border-gray-200 my-4"></div>

        <!-- 하단 정보 -->
        <div class="flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0">
            <p class="text-gray-600 text-sm">
                © 2025 Wonkyu Song. All Rights Reserved.
            </p>
        </div>
    </div>
</footer>
</body>
</html>
